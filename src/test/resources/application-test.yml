spring:
  datasource:
    url: jdbc:h2:mem:chainpoint;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: simple
  rabbitmq:
    listener:
      simple:
        auto-startup: false
jwt:
  secret: chainpoint-test-signing-secret-at-least-32-bytes
blockchain:
  enabled: false
