<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chờ thanh toán | ChainPoint POS</title>
  <meta name="description" content="Danh sách bill đã tạm tính hoặc chờ chuyển khoản, sẵn sàng để thu ngân thanh toán.">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/tables.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail rail-left">
      <button id="btn-hamburger" class="icon-btn" type="button" aria-label="Mở menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand-mark" title="ChainPoint">CP</div>
    </aside>

    <main class="main">
      <header class="page-head">
        <div>
          <h1>Chờ thanh toán</h1>
          <p class="sub">Bill đã tạm tính hoặc đang chờ khách chuyển khoản</p>
        </div>
        <div class="clock"><span id="clock-time">--:--</span><small id="clock-date"></small></div>
      </header>

      <section class="glass main-panel" aria-label="Danh sách bill chờ">
        <div class="bill-list" id="bill-list"></div>
      </section>
    </main>

    <nav class="rail rail-right" aria-label="Điều hướng chính">
      <a id="nav-tables" class="nav-btn" href="index.html"><span class="ico">🍽️</span>Chọn bàn</a>
      <a id="nav-pending" class="nav-btn active" href="pending.html"><span class="ico">🧾</span>Chờ thanh toán<b id="pending-count" class="nav-badge" data-zero="true">0</b></a>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pending.js"></script>
</body>
</html>
