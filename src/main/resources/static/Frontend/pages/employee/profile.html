<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChainPoint — Hồ sơ</title>
  <script src="../../js/common/session.js"></script>
  <link rel="stylesheet" href="../../css/base.css"><link rel="stylesheet" href="../../css/admin/admin.css">
</head>
<body>
  <div class="app"><aside class="sidebar"><div class="logo-text">ChainPoint</div><nav class="nav" id="sidebarNav"></nav><button id="logoutBtn" class="btn-logout" type="button">Đăng xuất</button></aside>
    <main class="main"><header class="topbar"><h1>Hồ sơ tài khoản</h1></header><section class="panel" style="padding:24px"><dl id="profileDetails" aria-live="polite"></dl></section></main>
  </div>
  <script src="../../js/common/ui.js"></script>
  <script>
    CP.ready.then(user => {
      const details = document.getElementById('profileDetails');
      [['Họ tên', user.fullName], ['Tên đăng nhập', user.username], ['Vai trò', user.role], ['Chi nhánh', user.branchName || 'Toàn hệ thống'], ['Số điện thoại', user.phone || '—']].forEach(([label, value]) => {
        const term = document.createElement('dt'), description = document.createElement('dd');
        term.textContent = label; description.textContent = value; description.style.marginBottom = '16px'; details.append(term, description);
      });
    }).catch(error => CP.notify(error.message));
  </script>
</body>
</html>
