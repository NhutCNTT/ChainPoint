<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainPoint — Đơn hàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/admin/admin.css" />
  <link rel="stylesheet" href="../../css/admin/tables.css" />
</head>
<body data-area="employee">
  <div class="app">
    <aside class="sidebar">
      <a class="logo" href="pos.html">
        <div class="logo-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5 14.5 9.5" /><path d="M11 6.5 12.8 4.7a4 4 0 0 1 5.6 0l.9.9a4 4 0 0 1 0 5.6L17.5 13" /><path d="M13 17.5 11.2 19.3a4 4 0 0 1-5.6 0l-.9-.9a4 4 0 0 1 0-5.6L6.5 11" /></svg>
        </div>
        <div class="logo-text">Chain<span>Point</span></div>
      </a>

      <nav class="nav" aria-label="Menu chính">
        <a href="pos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>
          Bán hàng
        </a>
        <a href="orders.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6"/><path d="M9 12h6"/></svg>
          Đơn hàng
        </a>
        <a href="customers.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>
          Tích điểm
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-logout" id="logoutBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/></svg>
          Đăng xuất
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Đơn hàng tại chi nhánh</h1>
          <p>Dữ liệu hóa đơn đồng bộ trực tiếp từ MySQL Database.</p>
        </div>
        <div class="user-chip">
          <span class="avatar" id="userAvatar">T</span>
          <div><span id="userName">Thu ngân</span><small id="userRole">Nhân viên</small></div>
        </div>
      </header>

      <section class="tables-toolbar">
        <div class="tables-search" style="width: 340px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="empOrderSearch" placeholder="Tìm mã đơn, bàn, SĐT khách..." />
        </div>
        <a href="../../pos/index.html" class="btn-primary" style="text-decoration:none;">Mở máy POS →</a>
      </section>

      <section class="panel" style="padding:0; overflow:hidden;">
        <table class="data-table">
          <thead>
            <tr style="background:#f8fafc; border-bottom:1px solid #e2e8f0; text-align:left;">
              <th style="padding:14px 18px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Mã đơn</th>
              <th style="padding:14px 18px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Thời gian</th>
              <th style="padding:14px 18px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Bàn</th>
              <th style="padding:14px 18px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Khách hàng</th>
              <th style="padding:14px 18px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Thực thu</th>
              <th style="padding:14px 18px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Phương thức</th>
              <th style="padding:14px 18px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Trạng thái</th>
            </tr>
          </thead>
          <tbody id="empOrdersBody">
            <tr><td colspan="7" style="text-align:center; padding:32px; color:var(--muted);">Đang tải dữ liệu đơn hàng từ Database...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="../../js/common/api.js"></script>
  <script>
    (function () {
      const formatVND = n => (Number(n) || 0).toLocaleString('vi-VN') + ' ₫';
      const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const user = sessionStorage.getItem('cp_user') || localStorage.getItem('cp_user') || 'Thu ngân';
      const branch = sessionStorage.getItem('cp_branch') || localStorage.getItem('cp_branch') || '';
      document.getElementById('userName').textContent = user;
      document.getElementById('userRole').textContent = branch ? `Chi nhánh: ${branch}` : 'Thu ngân POS';
      document.getElementById('userAvatar').textContent = user.charAt(0).toUpperCase();

      document.getElementById('logoutBtn').addEventListener('click', () => {
        ['cp_token', 'cp_role', 'cp_user', 'cp_branch', 'cp_branch_id'].forEach(k => {
          sessionStorage.removeItem(k);
          localStorage.removeItem(k);
        });
        window.location.href = '../auth/pos-login.html';
      });

      let allOrders = [];
      let query = '';
      const tbody = document.getElementById('empOrdersBody');

      function render() {
        const filtered = allOrders.filter(o => {
          if (!query) return true;
          const q = query.toLowerCase();
          return (o.billCode && o.billCode.toLowerCase().includes(q)) ||
                 (o.tableCode && String(o.tableCode).toLowerCase().includes(q)) ||
                 (o.customerPhone && o.customerPhone.includes(q)) ||
                 (o.customerName && o.customerName.toLowerCase().includes(q));
        });

        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:36px; color:var(--muted);">Chưa có đơn hàng nào trong Database.</td></tr>`;
          return;
        }

        tbody.innerHTML = filtered.map(o => {
          const badge = o.status === 'paid'
            ? `<span class="badge badge-success">✓ Đã thanh toán</span>`
            : (o.status === 'refunded' ? `<span class="badge badge-danger">↩ Đã hoàn tiền</span>` : `<span class="badge badge-warning">⏳ Chờ xử lý</span>`);
          const timeStr = o.createdAt ? new Date(o.createdAt).toLocaleString('vi-VN') : '—';
          return `
            <tr>
              <td style="padding:12px 18px; font-family:monospace; font-weight:700; color:var(--primary);">${escapeHtml(o.billCode)}</td>
              <td style="padding:12px 18px; font-size:13px; color:var(--muted);">${escapeHtml(timeStr)}</td>
              <td style="padding:12px 18px; font-weight:700;">Bàn ${escapeHtml(o.tableCode || '—')}</td>
              <td style="padding:12px 18px;">${escapeHtml(o.customerName || 'Khách vãng lai')} ${o.customerPhone ? `<small style="color:var(--muted);">(${escapeHtml(o.customerPhone)})</small>` : ''}</td>
              <td style="padding:12px 18px; font-weight:800; color:var(--text);">${formatVND(o.finalAmount || o.grossAmount || 0)}</td>
              <td style="padding:12px 18px;">${o.paymentMethod === 'transfer' ? 'Chuyển khoản VietQR' : 'Tiền mặt'}</td>
              <td style="padding:12px 18px;">${badge}</td>
            </tr>
          `;
        }).join('');
      }

      document.getElementById('empOrderSearch').addEventListener('input', (e) => {
        query = e.target.value.trim();
        render();
      });

      async function load() {
        try {
          const branchId = sessionStorage.getItem('cp_branch_id') || '';
          const endpoint = branchId ? `/orders?branchId=${branchId}` : '/orders';
          allOrders = await window.API.get(endpoint);
        } catch (e) {
          allOrders = [];
        }
        render();
      }
      load();
    })();
  </script>
</body>
</html>
