server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ChainPoint
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chainpoint?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:chainpoint}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  rabbitmq:
    virtual-host: ${RABBITMQ_VHOST:/}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple
    listener:
      simple:
        default-requeue-rejected: false
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000
blockchain:
  enabled: ${BLOCKCHAIN_ENABLED:false}
  rpc-url: ${BLOCKCHAIN_RPC_URL:https://rpc.sepolia.org}
  contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:}
  master-wallet-private-key: ${BLOCKCHAIN_PRIVATE_KEY:}
  gas-limit: ${BLOCKCHAIN_GAS_LIMIT:300000}
  chain-id: ${BLOCKCHAIN_CHAIN_ID:11155111}
payment:
  bank-code: ${PAYMENT_BANK_CODE:}
  bank-name: ${PAYMENT_BANK_NAME:}
  account-number: ${PAYMENT_ACCOUNT_NUMBER:}
  account-name: ${PAYMENT_ACCOUNT_NAME:}
  template: ${PAYMENT_TEMPLATE:compact2}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
