<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainPoint — Quản lý chuỗi chi nhánh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/admin/admin.css" />
  <link rel="stylesheet" href="../../css/admin/tables.css" />
</head>
<body data-area="admin">
  <div class="app">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <a class="logo" href="dashboard.html">
        <div class="logo-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 14.5 14.5 9.5" />
            <path d="M11 6.5 12.8 4.7a4 4 0 0 1 5.6 0l.9.9a4 4 0 0 1 0 5.6L17.5 13" />
            <path d="M13 17.5 11.2 19.3a4 4 0 0 1-5.6 0l-.9-.9a4 4 0 0 1 0-5.6L6.5 11" />
          </svg>
        </div>
        <div class="logo-text">Chain<span>Point</span></div>
      </a>

      <nav class="nav" id="sidebarNav" aria-label="Menu chính">
        <!-- Rendered by admin.js -->
      </nav>

      <div class="sidebar-footer">
        <button class="btn-logout" id="logoutBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/></svg>
          Đăng xuất
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1>Quản lý chuỗi chi nhánh</h1>
          <p>Tạo và quản lý các cơ sở nhà hàng, thông tin vận hành và chuyển đổi không gian làm việc.</p>
        </div>
        <div class="user-chip" title="Tài khoản hiện tại">
          <span class="avatar" id="userAvatar">O</span>
          <div><span id="userName">—</span><small id="userRole">—</small></div>
        </div>
      </header>

      <!-- Stats -->
      <section style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;">
        <div style="background: #ffffff; border-radius: 16px; padding: 18px 20px; border: 1px solid rgba(230, 235, 245, 0.9); box-shadow: 0 4px 16px -6px rgba(31, 64, 160, 0.06); display: flex; align-items: center; gap: 16px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: #eef4ff; color: var(--primary);">🏢</div>
          <div>
            <div style="font-size: 13px; font-weight: 600; color: var(--muted);">Tổng số chi nhánh</div>
            <div style="font-size: 22px; font-weight: 800; color: var(--text);" id="statTotalBranches">0</div>
          </div>
        </div>
        <div style="background: #ffffff; border-radius: 16px; padding: 18px 20px; border: 1px solid rgba(230, 235, 245, 0.9); box-shadow: 0 4px 16px -6px rgba(31, 64, 160, 0.06); display: flex; align-items: center; gap: 16px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: #eefbf3; color: #16a34a;">🟢</div>
          <div>
            <div style="font-size: 13px; font-weight: 600; color: var(--muted);">Đang mở cửa</div>
            <div style="font-size: 22px; font-weight: 800; color: var(--text);" id="statOpenBranches">0</div>
          </div>
        </div>
        <div style="background: #ffffff; border-radius: 16px; padding: 18px 20px; border: 1px solid rgba(230, 235, 245, 0.9); box-shadow: 0 4px 16px -6px rgba(31, 64, 160, 0.06); display: flex; align-items: center; gap: 16px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: #f5f0ff; color: #7c3aed;">🍽️</div>
          <div>
            <div style="font-size: 13px; font-weight: 600; color: var(--muted);">Tổng số bàn toàn chuỗi</div>
            <div style="font-size: 22px; font-weight: 800; color: var(--text);" id="statTotalTables">0</div>
          </div>
        </div>
        <div style="background: #ffffff; border-radius: 16px; padding: 18px 20px; border: 1px solid rgba(230, 235, 245, 0.9); box-shadow: 0 4px 16px -6px rgba(31, 64, 160, 0.06); display: flex; align-items: center; gap: 16px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: #fffbeb; color: #d97706;">👥</div>
          <div>
            <div style="font-size: 13px; font-weight: 600; color: var(--muted);">Nhân sự hoạt động</div>
            <div style="font-size: 22px; font-weight: 800; color: var(--text);" id="statTotalStaff">0</div>
          </div>
        </div>
      </section>

      <!-- Toolbar -->
      <section style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px;">
        <div style="position: relative; width: 340px;">
          <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="branchSearchInput" placeholder="Tìm theo tên chi nhánh, mã cơ sở, địa chỉ..." style="width: 100%; background: #ffffff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px 10px 38px; font-size: 13.5px;" />
        </div>

        <button class="btn-primary" id="addBranchBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tạo chi nhánh mới
        </button>
      </section>

      <!-- Branches Grid -->
      <section id="branchesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px;">
        <!-- Rendered by branches.js -->
      </section>
    </main>
  </div>

  <!-- Modal Tạo mới & Chỉnh sửa Chi nhánh -->
  <div class="modal-overlay" id="branchModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="branchModalTitle">Tạo chi nhánh mới</h3>
        <button class="modal-close-btn" id="closeBranchModalBtn" type="button" aria-label="Đóng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="branchForm">
        <input type="hidden" id="editingBranchId" value="" />

        <div class="form-row">
          <div class="form-group">
            <label for="formBranchCode">Mã cơ sở <span style="color:#ef4444">*</span></label>
            <input type="text" id="formBranchCode" placeholder="VD: CN-Q1, CN-TD" required />
          </div>
          <div class="form-group">
            <label for="formBranchName">Tên chi nhánh <span style="color:#ef4444">*</span></label>
            <input type="text" id="formBranchName" placeholder="VD: Chi nhánh Quận 1" required />
          </div>
        </div>

        <div class="form-group">
          <label for="formBranchAddress">Địa chỉ chi tiết <span style="color:#ef4444">*</span></label>
          <input type="text" id="formBranchAddress" placeholder="Số nhà, tên đường, phường, quận/huyện, tỉnh/thành" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="formBranchPhone">Số điện thoại hotline</label>
            <input type="tel" id="formBranchPhone" placeholder="VD: 028 3822 9988" />
          </div>
          <div class="form-group">
            <label for="formBranchManager">Quản lý phụ trách</label>
            <input type="text" id="formBranchManager" placeholder="VD: Nguyễn Văn Nam" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="formBranchHours">Giờ hoạt động</label>
            <input type="text" id="formBranchHours" placeholder="VD: 07:00 - 23:00" />
          </div>
          <div class="form-group">
            <label for="formBranchStatus">Trạng thái vận hành</label>
            <select id="formBranchStatus">
              <option value="open">Đang mở cửa (Hoạt động bình thường)</option>
              <option value="closed">Tạm đóng (Bảo trì / Sửa chữa)</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="cancelBranchModalBtn" type="button">Hủy bỏ</button>
          <button class="btn-primary" type="submit">Lưu chi nhánh</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../js/admin/admin.js"></script>
  <script src="../../js/admin/branches.js"></script>
</body>
</html>
