<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainPoint Branch — Quản lý Thực đơn (Menu)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/admin/admin.css" />
  <link rel="stylesheet" href="../../css/admin/tables.css" />
</head>
<body data-area="branch">
  <div class="app">
    <!-- Branch Left Sidebar (9 items) -->
    <aside class="sidebar">
      <a class="logo" href="dashboard.html">
        <div class="logo-mark" aria-hidden="true" style="background:linear-gradient(135deg, #10b981, #059669);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/>
          </svg>
        </div>
        <div class="logo-text">Chain<span>Point</span> <small style="font-size:10px; background:#ecfdf5; color:#059669; padding:2px 6px; border-radius:4px; font-weight:800;">BRANCH</small></div>
      </a>

      <nav class="nav" id="branchNav" aria-label="Menu Chi nhánh">
        <!-- Rendered by branch-nav.js -->
      </nav>

      <div class="sidebar-footer">
        <button class="btn-logout" id="branchLogoutBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/></svg>
          Đăng xuất
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="branchCurrentName">Thực đơn</h1>
          <p>Danh mục món ăn, đơn giá và trạng thái phục vụ.</p>
        </div>
        <div class="user-chip">
          <div class="avatar" id="branchUserAvatar">M</div>
          <div><span id="branchUserName">Quản lý</span><small id="branchUserRole" style="color:#059669; font-weight:700;">Quản lý</small></div>
        </div>
      </header>

      <!-- Stat Cards -->
      <section class="tables-overview-stats">
        <div class="table-stat-card">
          <div class="stat-icon blue">📋</div>
          <div class="stat-details">
            <h4>Tổng số món</h4>
            <div class="stat-number" id="statTotalDishes">0</div>
          </div>
        </div>
        <div class="table-stat-card">
          <div class="stat-icon green">✅</div>
          <div class="stat-details">
            <h4>Đang kinh doanh</h4>
            <div class="stat-number" id="statActiveDishes">0</div>
          </div>
        </div>
        <div class="table-stat-card">
          <div class="stat-icon amber">⚠️</div>
          <div class="stat-details">
            <h4>Tạm hết món</h4>
            <div class="stat-number" id="statOutDishes">0</div>
          </div>
        </div>
        <div class="table-stat-card">
          <div class="stat-icon purple">💰</div>
          <div class="stat-details">
            <h4>Giá trung bình</h4>
            <div class="stat-number" id="statAvgPrice" style="font-size: 20px;">0 ₫</div>
          </div>
        </div>
      </section>

      <!-- Category Filter Tabs & Actions -->
      <section class="tables-toolbar">
        <div class="filter-tabs" id="categoryTabs">
          <!-- Rendered by menu.js -->
        </div>

        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
          <div class="tables-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="menuSearchInput" placeholder="Tìm tên món, mã món..." />
          </div>

          <button class="btn-primary" id="btnAddDish" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Thêm món
          </button>
        </div>
      </section>

      <!-- Menu Table Panel -->
      <section class="panel" style="padding:0; overflow:hidden;">
        <table class="table" style="width:100%; border-collapse:collapse;">
          <thead>
            <tr style="background:#f8fafc; border-bottom:1px solid #e2e8f0; text-align:left;">
              <th style="padding:14px 20px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Mã món</th>
              <th style="padding:14px 20px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Tên món & Biểu tượng</th>
              <th style="padding:14px 20px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Phân loại danh mục</th>
              <th style="padding:14px 20px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Giá bán</th>
              <th style="padding:14px 20px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;">Trạng thái phục vụ</th>
              <th style="padding:14px 20px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; text-align:right;">Thao tác</th>
            </tr>
          </thead>
          <tbody id="menuTableBody">
            <!-- Rendered by menu.js -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Modal Thêm / Chỉnh sửa món ăn -->
  <div class="modal-overlay" id="dishModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="dishModalTitle">Thêm món ăn mới</h3>
        <button class="modal-close-btn" id="closeDishModal" type="button" aria-label="Đóng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="dishForm">
        <input type="hidden" id="editingDishId" value="" />

        <div class="form-row">
          <div class="form-group">
            <label for="dishId">Mã món <span style="color:#ef4444">*</span></label>
            <input type="text" id="dishId" placeholder="VD: m25" required />
          </div>
          <div class="form-group">
            <label for="dishEmoji">Biểu tượng / Emoji <span style="color:#ef4444">*</span></label>
            <input type="text" id="dishEmoji" placeholder="VD: 🥩, 🍗, ☕" required />
          </div>
        </div>

        <div class="form-group">
          <label for="dishName">Tên món ăn <span style="color:#ef4444">*</span></label>
          <input type="text" id="dishName" placeholder="VD: Bò lúc lắc sốt tiêu đen" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dishCat">Danh mục phân loại <span style="color:#ef4444">*</span></label>
            <select id="dishCat" required>
              <option value="hot">🔥 Món nóng</option>
              <option value="cold">🥗 Món lạnh</option>
              <option value="drink">🥤 Đồ uống</option>
              <option value="dessert">🍰 Tráng miệng</option>
              <option value="other">🍚 Món ăn kèm</option>
            </select>
          </div>
          <div class="form-group">
            <label for="dishPrice">Giá bán (VNĐ) <span style="color:#ef4444">*</span></label>
            <input type="number" id="dishPrice" placeholder="VD: 129000" min="0" step="1000" required />
          </div>
        </div>

        <div class="form-group">
          <label for="dishStatus">Trạng thái kinh doanh</label>
          <select id="dishStatus">
            <option value="available">Đang bán (Sẵn sàng phục vụ)</option>
            <option value="out_of_stock">Tạm hết món (Ngừng nhận order)</option>
          </select>
        </div>

        <div class="modal-foot">
          <button class="btn-secondary" id="cancelDishBtn" type="button">Hủy bỏ</button>
          <button class="btn-primary" id="saveDishBtn" type="submit">Lưu món ăn</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../js/common/ui.js"></script>
  <script src="../../js/branch/branch-nav.js"></script>
  <script src="../../js/branch/menu.js"></script>
</body>
</html>
